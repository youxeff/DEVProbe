name: DevProbe CI
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: devprobe
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: devprobe_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U devprobe -d devprobe_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip, cache-dependency-path: backend/requirements-dev.txt}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: pip install -r backend/requirements-dev.txt
      - run: python -m venv backend/tools/.venv && backend/tools/.venv/bin/pip install -r backend/tools/requirements.txt
      - run: npm ci --prefix backend/tools && npm ci --prefix frontend
      - name: Backend lint and tests
        working-directory: backend
        run: ruff check app tests scripts && pytest -q
      - name: PostgreSQL migration and persistence check
        working-directory: backend
        env:
          POSTGRES_TEST_URL: postgresql+psycopg://devprobe:ci-only-password@localhost:5432/devprobe_test
        run: python scripts/verify_postgresql.py
      - run: sudo apt-get update && sudo apt-get install -y redis-server
      - name: Queue integration check
        working-directory: backend
        run: python scripts/verify_queue.py
      - name: Frontend checks and production build
        working-directory: frontend
        env: {API_INTERNAL_URL: 'http://127.0.0.1:8100', NEXT_TELEMETRY_DISABLED: '1'}
        run: npm run lint && npm run type-check && npm run build
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Browser tests
        working-directory: frontend
        run: npm test
      - name: Authenticated browser workflow
        working-directory: frontend
        env: {E2E_AUTH: 'true'}
        run: npm test
      - uses: actions/upload-artifact@v4
        if: failure()
        with: {name: playwright-failure, path: frontend/test-results/}
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compose validation and image build
        env: {POSTGRES_PASSWORD: ci-only-password}
        run: docker compose config --quiet && docker compose build
      - name: Boot complete stack
        env: {POSTGRES_PASSWORD: ci-only-password}
        run: docker compose up --wait --wait-timeout 180 && curl --fail http://localhost:8000/health/ready && curl --fail http://localhost:3000
      - name: Container logs
        if: failure()
        run: docker compose logs --no-color
        env: {POSTGRES_PASSWORD: ci-only-password}
      - name: Tear down test stack
        if: always()
        run: docker compose down --volumes
        env: {POSTGRES_PASSWORD: ci-only-password}
